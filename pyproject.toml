[project]
name = "mc"
version = "0.1.0"
description = "Adaptive marathon training system — NYC Marathon 2026"
requires-python = ">=3.12"
dependencies = [
    "garminconnect",
    "curl_cffi",
    "ua-generator",
    "httpx",
    "pydantic",
    "typer",
    "rich",
    "jinja2",
    "python-dotenv",
]

[project.scripts]
mc = "mc.cli:app"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mc"]
